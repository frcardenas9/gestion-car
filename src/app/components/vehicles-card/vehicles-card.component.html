<div class="item">
  <div class="item-content">
    <div class="icon">
      <ion-icon src="assets/icons/car-side.svg"></ion-icon>
    </div>

    <div class="content">
      <p class="body-bold">{{ vehicle()?.name }}</p>
      <p class="subtitle">{{ vehicle()?.brand }} {{ vehicle()?.model }} {{ vehicle()?.year }}</p>
      <div class="detail">
        @if (vehicle()?.plate) {
          <p class="subtitle background">{{ vehicle()?.plate }}</p>
        }
        @if (vehicle()?.odometer) {
          <P class="subtitle">{{ vehicle()?.odometer }}</P>
        }
      </div>
    </div>

    <div class="arrow">
      <ion-icon src="assets/icons/angle-right.svg"></ion-icon>
    </div>
  </div>
  <app-divider></app-divider>
  <div class="item-buttons">
    <ion-button class="grey" size="small">
      <ion-icon slot="start" src="assets/icons/pencil.svg"></ion-icon>
      <p>Editar</p>
    </ion-button>
    <ion-button class="grey" size="small">
      <ion-icon slot="start" src="assets/icons/gas-pump-alt.svg"></ion-icon>
      <p>Recargar</p>
    </ion-button>
    <ion-button class="danger" color="danger" size="small" (click)="onClickDeleteVehicle()">
      <ion-icon slot="icon-only" src="assets/icons/trash.svg"></ion-icon>
    </ion-button>
  </div>
</div>
