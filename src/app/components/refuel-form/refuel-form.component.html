<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="onClickBackButton()">
        <ion-icon color="secondary" slot="icon-only" src="assets/icons/angle-left.svg"></ion-icon>
      </ion-button>
    </ion-buttons>
    @if (isEditMode) {
      <ion-title>Recarga de combustible</ion-title>
    } @else {
      <ion-title>Recarga de combustible</ion-title>
    }
  </ion-toolbar>
</ion-header>

<ion-content class="container">
  <div class="main-container">
    <div class="title">
      @if (isEditMode) {
        <p class="body-bold">Editar recarga</p>
      } @else {
        <p class="body-bold">Registrar recarga</p>
      }
    </div>
    <form class="form" [formGroup]="form" (ngSubmit)="onClickSaveRefuel()">
      <ion-input
        label="Fecha"
        labelPlacement="floating"
        fill="outline"
        placeholder="Fecha"
        formControlName="date"
        type="date"
      >
      </ion-input>

      <ion-input
        label="Odómetro"
        labelPlacement="floating"
        fill="outline"
        placeholder="Odómetro"
        formControlName="odometer"
        type="number"
        inputmode="numeric"
      >
      </ion-input>

      <ion-input
        label="Precio/galón"
        labelPlacement="floating"
        fill="outline"
        placeholder="Precio/galón"
        formControlName="price"
        type="number"
        inputmode="numeric"
        (ionChange)="calculateFuelAmount()"
      >
      </ion-input>

      <ion-input
        label="Total"
        labelPlacement="floating"
        fill="outline"
        placeholder="Total"
        formControlName="total"
        type="number"
        inputmode="numeric"
        (ionChange)="calculateFuelAmount()"
      >
      </ion-input>

      <ion-input
        label="Galones"
        labelPlacement="floating"
        fill="outline"
        placeholder="Galones"
        formControlName="fuelAmount"
        readonly
      >
      </ion-input>

      <ion-checkbox labelPlacement="start" formControlName="isFilling"> ¿Está llenando el tanque? </ion-checkbox>

      <ion-button type="submit" [disabled]="form.invalid">
        <ion-icon slot="start" src="assets/icons/gas-pump.svg"></ion-icon>
        Guardar
      </ion-button>
    </form>
  </div>
</ion-content>
