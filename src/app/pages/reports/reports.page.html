<app-header title="Reportes"></app-header>

<ion-content class="container">
  <div class="main-container">
    <div class="summary-container">
      <div class="title">
        <p class="body-bold">Total gastos</p>
      </div>
      <div class="content">
        <div class="text">
          <p class="h2">$836.800 <span class="caption">Mes</span></p>
        </div>
        <app-divider></app-divider>
        <div class="buttons">
          <span>
            <ion-icon slot="start" src="assets/icons/car-side.svg"></ion-icon>
            Todos
          </span>
          <span>Mazda 3</span>
          <span>Toyota Fortuner</span>
        </div>
      </div>
    </div>

    <div class="detail-container">
      <div class="title">
        <p class="body-bold">Detalle</p>
      </div>
      <div class="content">
        <div class="text">
          <p>$837.000</p>
        </div>
        <div class="value">
          <p class="value-item"><span class="dot"></span> Recargas</p>
          <p class="value-item"><span class="dot"></span> Servicios</p>
          <p class="value-item"><span class="dot"></span> Seguros</p>
          <p class="value-item"><span class="dot"></span> Otros</p>
        </div>
        <div class="description">
          <p>$485.500</p>
          <p>$220.000</p>
          <p>$89.000</p>
          <p>$42.300</p>
        </div>
      </div>
    </div>

    <div class="chart-container">
      <div class="title">
        <p class="body-bold">Tendencia mensual</p>
        <p class="caption">Últimos 6 meses</p>
      </div>

      <apx-chart
        [series]="chartOptions.series!"
        [chart]="chartOptions.chart!"
        [dataLabels]="chartOptions.dataLabels!"
        [stroke]="chartOptions.stroke!"
        [title]="chartOptions.title!"
        [grid]="chartOptions.grid!"
        [xaxis]="chartOptions.xaxis!"
      ></apx-chart>
    </div>
  </div>
</ion-content>
